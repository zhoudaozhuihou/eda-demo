<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - API Platform</title>
  <style>
    :root {
      --primary: #030213;
      --text: #333333;
      --muted: #717182;
      --bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #e0e0e0;
        --text: #e0e0e0;
        --muted: #a3a3a3;
        --bg: #121212;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: 4rem;
      margin: 0;
      line-height: 1;
    }
    h2 {
      font-size: 1.5rem;
      margin-top: 1rem;
      margin-bottom: 1rem;
      font-weight: normal;
    }
    p {
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: var(--bg);
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2 id="title">Page Not Found</h2>
    <p id="message">Sorry, the page you are looking for does not exist.</p>
    <a href="/" class="btn" id="home">Back to Home</a>
  </div>
  <script>
    const i18n = {
      'zh': {
        title: '页面未找到',
        message: '抱歉，您访问的页面不存在或已被移动。',
        home: '返回首页'
      },
      'en': {
        title: 'Page Not Found',
        message: 'Sorry, the page you are looking for does not exist or has been moved.',
        home: 'Back to Home'
      }
    };

    const lang = navigator.language.startsWith('zh') ? 'zh' : 'en';
    const t = i18n[lang];

    document.getElementById('title').innerText = t.title;
    document.getElementById('message').innerText = t.message;
    document.getElementById('home').innerText = t.home;
    document.title = t.title + ' - API Platform';
  </script>
</body>
</html>
